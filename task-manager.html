<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>청주대학교 업무 매니저</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --orange: #ea580c;
    --gray: #9ca3af;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --sub: #6b7280;
    --border: #e5e7eb;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif;
    color: var(--text);
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--blue);
    color: #fff;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 16px;
    position: sticky;
    top: 0;
    z-index: 20;
  }

  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

  main {
    flex: 1;
    padding: 16px 16px 110px;
  }

  .page { display: none; }
  .page.active { display: block; }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .card + .card { margin-top: 14px; }

  .btn {
    display: block;
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-ghost { background: none; color: var(--blue); border: 1.5px solid var(--blue); }
  .btn-danger-ghost { background: none; color: var(--red); border: 1.5px solid var(--red); }
  .btn-sm { padding: 9px 12px; font-size: 13px; border-radius: 9px; }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  .field-label {
    font-size: 12px;
    color: var(--sub);
    font-weight: 700;
    margin-bottom: 6px;
    display: block;
  }

  input[type=text], input[type=date], textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    background: #fff;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }

  select.select-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    background: #fff;
    color: var(--text);
  }

  .form-grid { display: flex; flex-direction: column; gap: 10px; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  .form-actions .btn { flex: 1; }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .field-row-2 { display: flex; gap: 10px; }
  .field-row-2 > div { flex: 1; }

  .empty-note {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    padding: 30px 10px;
  }

  /* ---- Filter chips ---- */
  .chip-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    background: #fff;
    color: var(--sub);
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* ---- Badges ---- */
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    vertical-align: middle;
  }
  .badge.dept { background: #eef2ff; color: #4338ca; margin-left: 6px; }
  .badge.assignee { background: #f0fdf4; color: #15803d; margin-left: 6px; }
  .badge.prio-high { background: #fef2f2; color: var(--red); }
  .badge.prio-mid { background: #fff7ed; color: var(--orange); }
  .badge.prio-low { background: #f3f4f6; color: var(--sub); }
  .badge.status-done { background: #ecfdf3; color: var(--green); }
  .badge.status-open { background: #eff6ff; color: var(--blue); }
  .badge.dday-over { background: #fef2f2; color: var(--red); }

  /* ---- Task list ---- */
  .task-item {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 10px;
  }
  .task-item.done { opacity: 0.6; }
  .task-item .top { display: flex; align-items: flex-start; gap: 10px; }
  .task-item .check {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: #fff;
    margin-top: 1px;
  }
  .task-item.done .check { background: var(--green); border-color: var(--green); }
  .task-item .body { flex: 1; min-width: 0; }
  .task-item .title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
  .task-item .title { font-weight: 700; font-size: 15px; }
  .task-item.done .title { text-decoration: line-through; color: var(--sub); }
  .task-item .meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .task-item .due { font-size: 12px; color: var(--sub); }
  .task-item .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .task-item .actions button {
    background: none; border: none; font-size: 16px; padding: 4px; color: var(--sub);
  }
  .task-item .memo-preview {
    font-size: 13px; color: var(--sub); margin-top: 8px;
    padding-top: 8px; border-top: 1px solid var(--border);
    white-space: pre-wrap;
  }
  .task-item .attach-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .task-item .attach-chip {
    font-size: 11px; color: var(--blue); background: #eff6ff;
    padding: 4px 9px; border-radius: 999px; text-decoration: none;
  }

  .custom-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .custom-row input { flex: 1; }
  .attach-preview-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .attach-preview-chip {
    font-size: 12px; background: #f3f4f6; padding: 5px 8px 5px 10px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .attach-preview-chip button { background: none; border: none; color: var(--red); font-size: 13px; cursor: pointer; }

  /* ---- Calendar ---- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav button { background: none; border: none; font-size: 18px; color: var(--blue); padding: 6px 10px; font-weight: 700; }
  .cal-nav .cal-title { font-size: 16px; font-weight: 800; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-dow { font-size: 11px; color: var(--sub); font-weight: 700; padding-bottom: 6px; }
  .cal-cell {
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    position: relative;
    background: #fff;
  }
  .cal-cell.empty { background: none; cursor: default; }
  .cal-cell.today { border: 1.5px solid var(--blue); font-weight: 700; }
  .cal-cell.selected { background: var(--blue); color: #fff; }
  .cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--orange); margin-top: 2px; }
  .cal-cell.selected .dot { background: #fff; }
  .cal-day-list { margin-top: 16px; }
  .cal-day-list .label { font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }

  /* ---- Assignee groups ---- */
  .group-card { margin-top: 12px; }
  .group-card .group-head {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 800; font-size: 15px; margin-bottom: 10px;
  }
  .group-card .group-head .count { font-size: 12px; color: var(--sub); font-weight: 500; }
  .search-row { margin-bottom: 12px; }

  footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 4px;
    z-index: 20;
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 8px 0 4px;
    font-size: 11px;
    color: var(--sub);
    background: none;
    border: none;
    cursor: pointer;
  }
  .tab-btn .icon { font-size: 20px; display: block; }
  .tab-btn.active { color: var(--blue); font-weight: 700; }

  .toast {
    position: fixed;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(17,24,39,0.9);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 50;
    display: none;
    max-width: 90%;
    text-align: center;
  }

  .fab {
    position: fixed;
    right: calc(50% - 240px + 18px);
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--blue);
    color: #fff;
    font-size: 26px;
    border: none;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    z-index: 25;
    cursor: pointer;
  }
  @media (max-width: 516px) {
    .fab { right: 18px; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>청주대학교 업무 매니저</h1>
    <div class="sub">부서·담당자별 업무 관리</div>
  </header>

  <main>
    <!-- 할일 탭 -->
    <div id="page-tasks" class="page active">
      <div class="card" id="task-form-card" style="display:none;">
        <div class="form-grid">
          <input type="hidden" id="edit-id">
          <div>
            <span class="field-label">업무 제목</span>
            <input type="text" id="f-title" placeholder="예: 2학기 수강신청 안내문 발송">
          </div>
          <div class="field-row-2">
            <div>
              <span class="field-label">부서</span>
              <input type="text" id="f-department" placeholder="예: 교무처" list="dept-list">
              <datalist id="dept-list"></datalist>
            </div>
            <div>
              <span class="field-label">담당자</span>
              <input type="text" id="f-assignee" placeholder="예: 홍길동" list="assignee-list">
              <datalist id="assignee-list"></datalist>
            </div>
          </div>
          <div class="field-row-2">
            <div>
              <span class="field-label">마감일</span>
              <input type="date" id="f-duedate">
            </div>
            <div>
              <span class="field-label">우선순위</span>
              <select id="f-priority" class="select-input">
                <option value="보통">보통</option>
                <option value="높음">높음</option>
                <option value="낮음">낮음</option>
              </select>
            </div>
          </div>
          <div>
            <span class="field-label">메모</span>
            <textarea id="f-memo" placeholder="업무 관련 메모를 입력하세요"></textarea>
          </div>
          <div>
            <span class="field-label">첨부파일</span>
            <button type="button" class="btn btn-ghost btn-sm" id="attach-btn">📎 파일 선택</button>
            <input type="file" id="f-attach-input" multiple style="display:none">
            <div class="attach-preview-row" id="attach-preview"></div>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" id="cancel-form-btn">취소</button>
            <button class="btn btn-primary" id="save-form-btn">저장</button>
          </div>
        </div>
      </div>

      <div class="chip-row" id="status-chip-row" style="margin-top:14px;">
        <button class="chip active" data-status="all">전체</button>
        <button class="chip" data-status="open">진행중</button>
        <button class="chip" data-status="done">완료</button>
      </div>

      <div class="search-row" style="margin-top:12px;">
        <input type="text" id="task-search" placeholder="제목, 부서, 담당자로 검색">
      </div>

      <div id="task-list"></div>
      <button class="fab" id="fab-add-btn">＋</button>
    </div>

    <!-- 캘린더 탭 -->
    <div id="page-calendar" class="page">
      <div class="card">
        <div class="cal-nav">
          <button id="cal-prev">‹</button>
          <div class="cal-title" id="cal-title"></div>
          <button id="cal-next">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="cal-day-list">
        <div class="label" id="cal-day-label"></div>
        <div id="cal-day-tasks"></div>
      </div>
    </div>

    <!-- 담당자 탭 -->
    <div id="page-assignee" class="page">
      <div class="search-row">
        <input type="text" id="assignee-search" placeholder="부서 또는 담당자 검색">
      </div>
      <div id="assignee-groups"></div>
    </div>

    <!-- 완료함 탭 -->
    <div id="page-done" class="page">
      <div id="done-list"></div>
    </div>
  </main>

  <footer>
    <button class="tab-btn active" data-tab="tasks"><span class="icon">📋</span>할일</button>
    <button class="tab-btn" data-tab="calendar"><span class="icon">📅</span>캘린더</button>
    <button class="tab-btn" data-tab="assignee"><span class="icon">👥</span>담당자</button>
    <button class="tab-btn" data-tab="done"><span class="icon">✅</span>완료함</button>
  </footer>

  <div class="toast" id="toast"></div>
</div>

<script>
const TASK_KEY = 'cjuTaskManagerTasks';

let idCounter = Date.now();
function nextId() { return idCounter++; }

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function loadTasks() {
  try { return JSON.parse(localStorage.getItem(TASK_KEY) || '[]'); }
  catch (e) { return []; }
}
function saveTasks(list) { localStorage.setItem(TASK_KEY, JSON.stringify(list)); }

function showToast(msg, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.style.display = 'none'; }, duration || 2400);
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function dDayLabel(dueDate) {
  if (!dueDate) return '';
  const today = new Date(todayStr());
  const due = new Date(dueDate);
  const diff = Math.round((due - today) / 86400000);
  if (diff === 0) return 'D-day';
  if (diff > 0) return 'D-' + diff;
  return 'D+' + Math.abs(diff);
}

/* ---------- Tab navigation ---------- */
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-btn[data-tab="${name}"]`).classList.add('active');
  if (name === 'tasks') renderTaskList();
  if (name === 'calendar') renderCalendar();
  if (name === 'assignee') renderAssigneeGroups();
  if (name === 'done') renderDoneList();
}
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchPage(btn.dataset.tab));
});

/* ---------- Task form ---------- */
const taskFormCard = document.getElementById('task-form-card');
const editIdInput = document.getElementById('edit-id');
const fTitle = document.getElementById('f-title');
const fDepartment = document.getElementById('f-department');
const fAssignee = document.getElementById('f-assignee');
const fDuedate = document.getElementById('f-duedate');
const fPriority = document.getElementById('f-priority');
const fMemo = document.getElementById('f-memo');
const attachPreview = document.getElementById('attach-preview');
let pendingAttachments = [];

function refreshDatalists() {
  const tasks = loadTasks();
  const depts = [...new Set(tasks.map(t => t.department).filter(Boolean))];
  const assignees = [...new Set(tasks.map(t => t.assignee).filter(Boolean))];
  document.getElementById('dept-list').innerHTML = depts.map(d => `<option value="${escapeHtml(d)}">`).join('');
  document.getElementById('assignee-list').innerHTML = assignees.map(a => `<option value="${escapeHtml(a)}">`).join('');
}

function renderAttachPreview() {
  attachPreview.innerHTML = pendingAttachments.map((a, i) => `
    <span class="attach-preview-chip">📎 ${escapeHtml(a.name)}<button type="button" data-remove-attach="${i}">✕</button></span>
  `).join('');
}
attachPreview.addEventListener('click', e => {
  const btn = e.target.closest('[data-remove-attach]');
  if (btn) { pendingAttachments.splice(Number(btn.dataset.removeAttach), 1); renderAttachPreview(); }
});

document.getElementById('attach-btn').addEventListener('click', () => document.getElementById('f-attach-input').click());
document.getElementById('f-attach-input').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  for (const file of files) {
    if (file.size > 4 * 1024 * 1024) { showToast(`"${file.name}" 파일이 너무 큽니다 (4MB 이하만 첨부 가능).`); continue; }
    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      pendingAttachments.push({ id: nextId(), name: file.name, dataUrl });
    } catch (err) { showToast(`"${file.name}" 파일을 읽지 못했습니다.`); }
  }
  renderAttachPreview();
});

function openTaskForm(task) {
  taskFormCard.style.display = 'block';
  refreshDatalists();
  if (task) {
    editIdInput.value = task.id;
    fTitle.value = task.title || '';
    fDepartment.value = task.department || '';
    fAssignee.value = task.assignee || '';
    fDuedate.value = task.dueDate || '';
    fPriority.value = task.priority || '보통';
    fMemo.value = task.memo || '';
    pendingAttachments = (task.attachments || []).slice();
  } else {
    editIdInput.value = '';
    fTitle.value = '';
    fDepartment.value = '';
    fAssignee.value = '';
    fDuedate.value = '';
    fPriority.value = '보통';
    fMemo.value = '';
    pendingAttachments = [];
  }
  renderAttachPreview();
  fTitle.focus();
  taskFormCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function closeTaskForm() { taskFormCard.style.display = 'none'; }

document.getElementById('fab-add-btn').addEventListener('click', () => openTaskForm());
document.getElementById('cancel-form-btn').addEventListener('click', closeTaskForm);

document.getElementById('save-form-btn').addEventListener('click', () => {
  const title = fTitle.value.trim();
  if (!title) { showToast('업무 제목은 필수입니다.'); return; }

  const list = loadTasks();
  const id = editIdInput.value ? Number(editIdInput.value) : nextId();
  const existing = list.find(t => t.id === id);
  const task = {
    id,
    title,
    department: fDepartment.value.trim(),
    assignee: fAssignee.value.trim(),
    dueDate: fDuedate.value || '',
    priority: fPriority.value,
    memo: fMemo.value.trim(),
    attachments: pendingAttachments,
    status: existing ? existing.status : '진행중',
    createdAt: existing ? existing.createdAt : new Date().toISOString(),
    completedAt: existing ? existing.completedAt : null,
  };

  const idx = list.findIndex(t => t.id === id);
  if (idx >= 0) list[idx] = task; else list.unshift(task);
  saveTasks(list);
  closeTaskForm();
  renderTaskList();
  showToast('저장되었습니다.');
});

/* ---------- Task list ---------- */
let currentStatusFilter = 'all';
document.getElementById('status-chip-row').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#status-chip-row .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentStatusFilter = chip.dataset.status;
  renderTaskList();
});
document.getElementById('task-search').addEventListener('input', renderTaskList);

function priorityBadgeClass(p) {
  if (p === '높음') return 'prio-high';
  if (p === '낮음') return 'prio-low';
  return 'prio-mid';
}

function renderTaskItem(t) {
  const isDone = t.status === '완료';
  const dday = t.dueDate ? dDayLabel(t.dueDate) : '';
  const overdue = !isDone && t.dueDate && t.dueDate < todayStr();
  return `
    <div class="task-item ${isDone ? 'done' : ''}" data-id="${t.id}">
      <div class="top">
        <button class="check" data-toggle="${t.id}">${isDone ? '✓' : ''}</button>
        <div class="body">
          <div class="title-row">
            <span class="title">${escapeHtml(t.title)}</span>
            ${t.department ? `<span class="badge dept">${escapeHtml(t.department)}</span>` : ''}
            ${t.assignee ? `<span class="badge assignee">${escapeHtml(t.assignee)}</span>` : ''}
          </div>
          <div class="meta-row">
            <span class="badge ${priorityBadgeClass(t.priority)}">${escapeHtml(t.priority)}</span>
            <span class="badge ${isDone ? 'status-done' : 'status-open'}">${isDone ? '완료' : '진행중'}</span>
            ${t.dueDate ? `<span class="due ${overdue ? 'dday-over' : ''}">${escapeHtml(t.dueDate)} · ${dday}</span>` : ''}
          </div>
          ${t.memo ? `<div class="memo-preview">${escapeHtml(t.memo)}</div>` : ''}
          ${(t.attachments || []).length ? `<div class="attach-list">${t.attachments.map(a => `<a class="attach-chip" href="${a.dataUrl}" download="${escapeHtml(a.name)}">📎 ${escapeHtml(a.name)}</a>`).join('')}</div>` : ''}
        </div>
        <div class="actions">
          <button data-edit="${t.id}">✏️</button>
          <button data-del="${t.id}">🗑️</button>
        </div>
      </div>
    </div>`;
}

function filterTasks(list) {
  const q = document.getElementById('task-search').value.trim().toLowerCase();
  return list.filter(t => {
    if (currentStatusFilter === 'open' && t.status === '완료') return false;
    if (currentStatusFilter === 'done' && t.status !== '완료') return false;
    if (!q) return true;
    return (t.title || '').toLowerCase().includes(q)
      || (t.department || '').toLowerCase().includes(q)
      || (t.assignee || '').toLowerCase().includes(q);
  });
}

function sortTasks(list) {
  return list.slice().sort((a, b) => {
    if (a.status !== b.status) return a.status === '완료' ? 1 : -1;
    if (a.dueDate && b.dueDate) return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0);
    if (a.dueDate) return -1;
    if (b.dueDate) return 1;
    return b.createdAt < a.createdAt ? -1 : 1;
  });
}

function renderTaskList() {
  const all = loadTasks();
  const filtered = sortTasks(filterTasks(all));
  const container = document.getElementById('task-list');
  if (!filtered.length) {
    container.innerHTML = `<div class="empty-note">${all.length ? '조건에 맞는 업무가 없습니다.' : '등록된 업무가 없습니다. 오른쪽 아래 + 버튼으로 새 업무를 등록하세요.'}</div>`;
    return;
  }
  container.innerHTML = filtered.map(renderTaskItem).join('');
}

document.getElementById('task-list').addEventListener('click', e => {
  const toggleBtn = e.target.closest('[data-toggle]');
  if (toggleBtn) {
    const list = loadTasks();
    const t = list.find(x => x.id === Number(toggleBtn.dataset.toggle));
    if (t) {
      t.status = t.status === '완료' ? '진행중' : '완료';
      t.completedAt = t.status === '완료' ? new Date().toISOString() : null;
      saveTasks(list);
      renderTaskList();
    }
    return;
  }
  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    const t = loadTasks().find(x => x.id === Number(editBtn.dataset.edit));
    if (t) openTaskForm(t);
    return;
  }
  const delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    if (!confirm('이 업무를 삭제할까요?')) return;
    saveTasks(loadTasks().filter(x => x.id !== Number(delBtn.dataset.del)));
    renderTaskList();
  }
});

/* ---------- Calendar ---------- */
let calYear, calMonth, calSelectedDate = null;
(function initCal() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
})();

function renderCalendar() {
  const tasks = loadTasks();
  const byDate = {};
  tasks.forEach(t => { if (t.dueDate) (byDate[t.dueDate] = byDate[t.dueDate] || []).push(t); });

  document.getElementById('cal-title').textContent = `${calYear}년 ${calMonth + 1}월`;
  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = todayStr();

  const dowNames = ['일', '월', '화', '수', '목', '금', '토'];
  let html = dowNames.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < firstDow; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const has = byDate[dateStr] && byDate[dateStr].length;
    const cls = ['cal-cell'];
    if (dateStr === today) cls.push('today');
    if (dateStr === calSelectedDate) cls.push('selected');
    html += `<div class="${cls.join(' ')}" data-date="${dateStr}">${d}${has ? '<span class="dot"></span>' : ''}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;

  if (!calSelectedDate) calSelectedDate = today;
  renderCalDayTasks(byDate);
}

function renderCalDayTasks(byDate) {
  const label = document.getElementById('cal-day-label');
  const container = document.getElementById('cal-day-tasks');
  if (!calSelectedDate) { label.textContent = ''; container.innerHTML = ''; return; }
  label.textContent = `${calSelectedDate} 마감 업무`;
  const items = (byDate || {})[calSelectedDate] || loadTasks().filter(t => t.dueDate === calSelectedDate);
  if (!items.length) { container.innerHTML = `<div class="empty-note">이 날짜에 마감인 업무가 없습니다.</div>`; return; }
  container.innerHTML = sortTasks(items).map(renderTaskItem).join('');
}

document.getElementById('cal-prev').addEventListener('click', () => {
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', () => {
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});
document.getElementById('cal-grid').addEventListener('click', e => {
  const cell = e.target.closest('.cal-cell[data-date]');
  if (!cell) return;
  calSelectedDate = cell.dataset.date;
  renderCalendar();
});
document.getElementById('cal-day-tasks').addEventListener('click', e => {
  const toggleBtn = e.target.closest('[data-toggle]');
  if (toggleBtn) {
    const list = loadTasks();
    const t = list.find(x => x.id === Number(toggleBtn.dataset.toggle));
    if (t) {
      t.status = t.status === '완료' ? '진행중' : '완료';
      t.completedAt = t.status === '완료' ? new Date().toISOString() : null;
      saveTasks(list);
      renderCalendar();
    }
    return;
  }
  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    const t = loadTasks().find(x => x.id === Number(editBtn.dataset.edit));
    if (t) { switchPage('tasks'); openTaskForm(t); }
    return;
  }
  const delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    if (!confirm('이 업무를 삭제할까요?')) return;
    saveTasks(loadTasks().filter(x => x.id !== Number(delBtn.dataset.del)));
    renderCalendar();
  }
});

/* ---------- Assignee / department groups ---------- */
document.getElementById('assignee-search').addEventListener('input', renderAssigneeGroups);

function renderAssigneeGroups() {
  const tasks = loadTasks();
  const q = document.getElementById('assignee-search').value.trim().toLowerCase();
  const groups = new Map();
  tasks.forEach(t => {
    const dept = t.department || '부서 미지정';
    const assignee = t.assignee || '담당자 미지정';
    const key = dept + ' / ' + assignee;
    if (!groups.has(key)) groups.set(key, { dept, assignee, tasks: [] });
    groups.get(key).tasks.push(t);
  });

  let entries = [...groups.values()];
  if (q) entries = entries.filter(g => g.dept.toLowerCase().includes(q) || g.assignee.toLowerCase().includes(q));
  entries.sort((a, b) => (a.dept + a.assignee).localeCompare(b.dept + b.assignee, 'ko'));

  const container = document.getElementById('assignee-groups');
  if (!entries.length) {
    container.innerHTML = `<div class="empty-note">${tasks.length ? '검색 결과가 없습니다.' : '등록된 업무가 없습니다.'}</div>`;
    return;
  }
  container.innerHTML = entries.map(g => {
    const openCount = g.tasks.filter(t => t.status !== '완료').length;
    const doneCount = g.tasks.length - openCount;
    return `
      <div class="card group-card">
        <div class="group-head">
          <span>${escapeHtml(g.dept)} · ${escapeHtml(g.assignee)}</span>
          <span class="count">진행중 ${openCount} · 완료 ${doneCount}</span>
        </div>
        ${sortTasks(g.tasks).map(renderTaskItem).join('')}
      </div>`;
  }).join('');
}

document.getElementById('assignee-groups').addEventListener('click', e => {
  const toggleBtn = e.target.closest('[data-toggle]');
  if (toggleBtn) {
    const list = loadTasks();
    const t = list.find(x => x.id === Number(toggleBtn.dataset.toggle));
    if (t) {
      t.status = t.status === '완료' ? '진행중' : '완료';
      t.completedAt = t.status === '완료' ? new Date().toISOString() : null;
      saveTasks(list);
      renderAssigneeGroups();
    }
    return;
  }
  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    const t = loadTasks().find(x => x.id === Number(editBtn.dataset.edit));
    if (t) { switchPage('tasks'); openTaskForm(t); }
    return;
  }
  const delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    if (!confirm('이 업무를 삭제할까요?')) return;
    saveTasks(loadTasks().filter(x => x.id !== Number(delBtn.dataset.del)));
    renderAssigneeGroups();
  }
});

/* ---------- Done archive ---------- */
function renderDoneList() {
  const list = loadTasks().filter(t => t.status === '완료')
    .sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
  const container = document.getElementById('done-list');
  if (!list.length) {
    container.innerHTML = `<div class="empty-note">완료된 업무가 없습니다.</div>`;
    return;
  }
  container.innerHTML =
    `<div style="display:flex; gap:8px; margin-bottom:4px;">
      <button class="btn btn-danger-ghost btn-sm" id="clear-done-btn" style="flex:1;">완료 업무 전체 삭제</button>
    </div>` +
    list.map(renderTaskItem).join('');
}

document.getElementById('done-list').addEventListener('click', e => {
  if (e.target.id === 'clear-done-btn') {
    if (!confirm('완료된 업무를 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
    saveTasks(loadTasks().filter(t => t.status !== '완료'));
    renderDoneList();
    return;
  }
  const toggleBtn = e.target.closest('[data-toggle]');
  if (toggleBtn) {
    const list = loadTasks();
    const t = list.find(x => x.id === Number(toggleBtn.dataset.toggle));
    if (t) {
      t.status = t.status === '완료' ? '진행중' : '완료';
      t.completedAt = t.status === '완료' ? new Date().toISOString() : null;
      saveTasks(list);
      renderDoneList();
    }
    return;
  }
  const editBtn = e.target.closest('[data-edit]');
  if (editBtn) {
    const t = loadTasks().find(x => x.id === Number(editBtn.dataset.edit));
    if (t) { switchPage('tasks'); openTaskForm(t); }
    return;
  }
  const delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    if (!confirm('이 업무를 삭제할까요?')) return;
    saveTasks(loadTasks().filter(x => x.id !== Number(delBtn.dataset.del)));
    renderDoneList();
  }
});

renderTaskList();
