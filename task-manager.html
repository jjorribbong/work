<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>청주대학교 업무 매니저</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --orange: #ea580c;
    --gray: #9ca3af;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --sub: #6b7280;
    --border: #e5e7eb;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif;
    color: var(--text);
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--blue);
    color: #fff;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 16px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }

  main { flex: 1; padding: 16px 16px 100px; }
  .page { display: none; }
  .page.active { display: block; }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .card + .card { margin-top: 14px; }

  .btn {
    display: block; width: 100%; border: none; border-radius: 12px;
    padding: 15px; font-size: 15px; font-weight: 700; cursor: pointer;
    text-align: center; text-decoration: none;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-ghost { background: none; color: var(--blue); border: 1.5px solid var(--blue); }
  .btn-danger-ghost { background: none; color: var(--red); border: 1.5px solid var(--red); }
  .btn-sm { padding: 9px 12px; font-size: 13px; border-radius: 9px; }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  input[type=text] {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 15px; background: #fff;
  }
  select.select-input {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 12px; font-size: 14px; background: #fff; color: var(--text);
  }

  .search-row { margin-bottom: 10px; }
  .search-row + .search-row { margin-top: -4px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .filter-row > * { flex: 1; min-width: 0; }
  .field-label { font-size: 12px; color: var(--sub); font-weight: 700; margin-bottom: 6px; display: block; }

  .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; }
  .chip {
    flex-shrink: 0; padding: 7px 14px; border-radius: 999px; font-size: 13px;
    font-weight: 700; background: #fff; color: var(--sub); border: 1px solid var(--border); cursor: pointer;
  }
  .chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  .list-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .count-label { font-size: 12px; color: var(--sub); }
  .sort-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--sub); }

  .empty-note { text-align: center; color: var(--sub); font-size: 13px; padding: 30px 10px; }

  /* Document card */
  .doc-item { background: var(--card); border-radius: 12px; padding: 14px 16px; margin-top: 10px; }
  .doc-item .title-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .badge-receive { background: #eff6ff; color: var(--blue); }
  .badge-send { background: #ecfdf3; color: var(--green); }
  .badge-doctype { background: #eef2ff; color: #4338ca; }
  .doc-title { font-weight: 700; font-size: 15px; line-height: 1.4; }
  .doc-meta { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .doc-rows { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .doc-rows .row { font-size: 13px; margin-top: 4px; color: var(--text); }
  .doc-rows .row .k { color: var(--sub); margin-right: 6px; }

  /* Upload page */
  .upload-stat { display: flex; justify-content: space-between; align-items: center; }
  .upload-stat .num { font-size: 28px; font-weight: 800; color: var(--blue); }
  .upload-stat .label { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .upload-meta { font-size: 12px; color: var(--sub); margin-top: 10px; line-height: 1.6; }
  .import-hint { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.5; }

  /* Stats page */
  .stat-total { text-align: center; padding: 10px 0; }
  .stat-total .num { font-size: 34px; font-weight: 800; color: var(--blue); }
  .stat-total .label { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .stat-section-title { font-size: 14px; font-weight: 800; margin-bottom: 12px; }
  .stat-row { margin-top: 10px; }
  .stat-row:first-child { margin-top: 0; }
  .stat-row-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .stat-row-label span:last-child { color: var(--sub); }
  .stat-bar-bg { background: #f3f4f6; border-radius: 999px; height: 8px; overflow: hidden; }
  .stat-bar-fill { background: var(--blue); height: 100%; border-radius: 999px; }

  /* Reminder banner */
  .reminder-banner {
    background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px; font-size: 13px; color: #9a3412;
  }
  .reminder-banner .title { font-weight: 800; margin-bottom: 4px; }
  .reminder-banner .item { margin-top: 2px; }
  .reminder-banner .more-link { background: none; border: none; color: var(--blue); font-size: 12px; font-weight: 700; margin-top: 6px; padding: 0; }

  /* Schedule tab */
  .schedule-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .schedule-name { font-size: 17px; font-weight: 800; }
  .schedule-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .schedule-header .btn { width: auto; }

  .month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .month-cell {
    border: 1px solid var(--border); border-radius: 10px; background: #fff;
    padding: 10px 4px; text-align: center; cursor: pointer;
  }
  .month-cell.active { background: var(--blue); border-color: var(--blue); }
  .month-cell.active .m-label, .month-cell.active .m-count { color: #fff; }
  .month-cell .m-label { font-size: 13px; font-weight: 700; }
  .month-cell .m-count { font-size: 11px; color: var(--orange); margin-top: 3px; min-height: 14px; font-weight: 700; }
  .month-cell.active .m-count { color: #fff; }

  .upcoming-item { padding: 10px 0; border-top: 1px solid var(--border); }
  .upcoming-item:first-child { border-top: none; padding-top: 0; }
  .upcoming-date { font-size: 12px; color: var(--orange); font-weight: 700; }
  .upcoming-title { font-size: 14px; font-weight: 700; margin-top: 3px; }
  .upcoming-years { font-size: 12px; color: var(--sub); margin-top: 3px; }

  .pattern-item { padding: 10px 0; border-top: 1px solid var(--border); }
  .pattern-item:first-child { border-top: none; padding-top: 0; }
  .badge-pattern { background: #fef3c7; color: #92400e; }
  .pattern-title { font-size: 14px; font-weight: 700; margin-top: 5px; }
  .pattern-meta { font-size: 12px; color: var(--sub); margin-top: 3px; }
  .del-btn { flex-shrink: 0; background: none; border: none; color: var(--gray); font-size: 16px; padding: 2px 4px; cursor: pointer; }

  /* Schedule pick-list */
  .sched-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 0; border-top: 1px solid var(--border); cursor: pointer;
  }
  .sched-row:first-child { border-top: none; padding-top: 0; }
  .sched-checkbox { flex-shrink: 0; width: 20px; height: 20px; margin-top: 2px; accent-color: var(--blue); }
  .sched-row-body { flex: 1; min-width: 0; }
  .sched-row-top { display: flex; gap: 6px; margin-bottom: 5px; }
  .sched-row-title { font-size: 14px; font-weight: 700; line-height: 1.4; }
  .sched-row-date { font-size: 12px; color: var(--sub); margin-top: 3px; }

  .month-group-title { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 800; margin-bottom: 8px; }
  .month-group-count { font-size: 12px; color: var(--sub); font-weight: 500; }

  details.import-box summary {
    font-size: 13px; color: var(--blue); font-weight: 700; cursor: pointer; padding: 6px 0;
  }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto;
    background: var(--card); border-top: 1px solid var(--border);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 4px; z-index: 20;
  }
  .tab-btn { flex: 1; text-align: center; padding: 8px 0 4px; font-size: 11px; color: var(--sub); background: none; border: none; cursor: pointer; }
  .tab-btn .icon { font-size: 20px; display: block; }
  .tab-btn.active { color: var(--blue); font-weight: 700; }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: rgba(17,24,39,0.9); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; z-index: 50; display: none; max-width: 90%; text-align: center;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>청주대학교 업무 매니저</h1>
    <div class="sub">문서 접수·발송 등록대장</div>
  </header>

  <main>
    <!-- 조회 탭 -->
    <div id="page-browse" class="page active">
      <div id="reminder-banner-area"></div>

      <div class="search-row">
        <span class="field-label">제목 키워드</span>
        <input type="text" id="title-search" placeholder="제목에 포함된 단어로 검색">
      </div>
      <div class="search-row">
        <span class="field-label">담당자(원기안자)</span>
        <input type="text" id="drafter-search" list="drafter-datalist" placeholder="담당자 이름으로 검색">
      </div>
      <datalist id="drafter-datalist"></datalist>

      <div class="chip-row" id="regtype-chip-row">
        <button class="chip active" data-regtype="all">전체</button>
        <button class="chip" data-regtype="접수">접수</button>
        <button class="chip" data-regtype="발송">생산/발송</button>
      </div>
      <div class="filter-row">
        <select id="doctype-select" class="select-input"><option value="">문서종류 전체</option></select>
        <select id="year-select" class="select-input"><option value="">연도 전체</option></select>
      </div>
      <button class="btn btn-primary" id="search-btn" style="margin-bottom:10px;">🔍 검색</button>
      <div class="list-toolbar">
        <span class="count-label" id="count-label"></span>
        <button class="sort-btn" id="sort-toggle-btn">최신순 ▾</button>
      </div>
      <div id="doc-list"></div>
      <button class="btn btn-ghost" id="load-more-btn" style="margin-top:12px; display:none;">더 보기</button>
    </div>

    <!-- 일정 탭 -->
    <div id="page-schedule" class="page">
      <div id="schedule-content"></div>
    </div>

    <!-- 업로드 탭 -->
    <div id="page-upload" class="page">
      <div class="card">
        <div class="upload-stat">
          <div>
            <div class="num" id="upload-count">0건</div>
            <div class="label">저장된 문서 건수</div>
          </div>
        </div>
        <div class="upload-meta" id="upload-meta">업로드된 파일이 없습니다.</div>
      </div>

      <div class="card">
        <button class="btn btn-primary" id="upload-btn">📤 등록대장 엑셀 업로드</button>
        <input type="file" id="upload-file-input" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none">
        <div class="import-hint">문서등록대장 엑셀 파일(.xls/.xlsx)을 업로드하세요. "등록구분" 열이 있는 표를 자동으로 인식합니다. 새로 업로드하면 기존 데이터는 새 파일 내용으로 전체 교체됩니다. 파일은 서버로 전송되지 않고 이 기기의 브라우저에서만 처리·저장됩니다.</div>
        <button class="btn btn-danger-ghost btn-sm" id="clear-all-btn" style="margin-top:12px;">전체 삭제</button>
      </div>
    </div>

    <!-- 통계 탭 -->
    <div id="page-stats" class="page">
      <div class="card">
        <div class="stat-total">
          <div class="num" id="stat-total-num">0건</div>
          <div class="label">전체 등록 문서</div>
        </div>
      </div>
      <div class="card">
        <div class="stat-section-title">등록구분별</div>
        <div id="stat-regtype"></div>
      </div>
      <div class="card">
        <div class="stat-section-title">문서종류별</div>
        <div id="stat-doctype"></div>
      </div>
      <div class="card">
        <div class="stat-section-title">연도별</div>
        <div id="stat-year"></div>
      </div>
    </div>
  </main>

  <footer>
    <button class="tab-btn active" data-tab="browse"><span class="icon">🔍</span>조회</button>
    <button class="tab-btn" data-tab="schedule"><span class="icon">📅</span>일정</button>
    <button class="tab-btn" data-tab="upload"><span class="icon">📤</span>업로드</button>
    <button class="tab-btn" data-tab="stats"><span class="icon">📊</span>통계</button>
  </footer>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DB_NAME = 'cjuDocRegisterDB';
const DB_VERSION = 1;
const STORE = 'documents';
const META_KEY = 'cjuDocRegisterMeta';

const FIELD_MAP = {
  regType: '등록구분',
  regDate: '생산접수등록일자',
  title: '제목',
  docType: '문서종류',
  approverPosition: '결재권자직위',
  drafter: '원기안자',
  recipient: '수신자발신자',
};

let allDocs = [];
let filteredDocs = [];
let visibleCount = 0;
const PAGE_SIZE = 40;
let sortOrder = 'desc';
let currentRegTypeChip = 'all';

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function showToast(msg, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.style.display = 'none'; }, duration || 2400);
}

/* ---------- IndexedDB ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbReplaceAll(records) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    store.clear();
    records.forEach(r => store.put(r));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbClearAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function loadMeta() {
  try { return JSON.parse(localStorage.getItem(META_KEY) || 'null'); }
  catch (e) { return null; }
}
function saveMeta(meta) { localStorage.setItem(META_KEY, JSON.stringify(meta)); }

/* ---------- Tab navigation ---------- */
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-btn[data-tab="${name}"]`).classList.add('active');
  if (name === 'stats') renderStats();
  if (name === 'schedule') renderScheduleView();
}
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchPage(btn.dataset.tab));
});

/* ---------- Excel parsing ---------- */
function parseSheetRows(rows) {
  let headerRowIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const row = rows[i] || [];
    if (row.some(c => String(c == null ? '' : c).trim() === '등록구분')) { headerRowIdx = i; break; }
  }
  if (headerRowIdx === -1) throw new Error('HEADER_NOT_FOUND');

  const header = (rows[headerRowIdx] || []).map(h => String(h == null ? '' : h).trim());
  const idx = {};
  for (const key in FIELD_MAP) idx[key] = header.indexOf(FIELD_MAP[key]);
  if (idx.regType === -1 || idx.title === -1) throw new Error('MISSING_COLUMN');

  const records = [];
  let localId = 1;
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const title = String(row[idx.title] == null ? '' : row[idx.title]).trim();
    const regType = String(row[idx.regType] == null ? '' : row[idx.regType]).trim();
    if (!title || !regType) continue;
    const rec = { id: localId++, regType, title };
    for (const key of ['regDate', 'docType', 'approverPosition', 'drafter', 'recipient']) {
      const col = idx[key];
      rec[key] = col === -1 ? '' : String(row[col] == null ? '' : row[col]).trim();
    }
    records.push(rec);
  }
  return records;
}

function shortRegType(rt) {
  if ((rt || '').includes('접수')) return '접수';
  if ((rt || '').includes('발송')) return '발송';
  return rt || '';
}

/* ---------- Upload ---------- */
document.getElementById('upload-btn').addEventListener('click', () => document.getElementById('upload-file-input').click());

document.getElementById('upload-file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  if (typeof XLSX === 'undefined') {
    showToast('엑셀 처리 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침 후 다시 시도해주세요.', 6000);
    return;
  }

  showToast('파일을 분석하는 중입니다...', 60000);
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    const records = parseSheetRows(rows);

    if (!records.length) { showToast('파일에서 유효한 데이터를 찾지 못했습니다.'); return; }

    const prevCount = allDocs.length;
    if (prevCount > 0) {
      const ok = confirm(`기존에 저장된 ${prevCount.toLocaleString()}건을 새 파일의 ${records.length.toLocaleString()}건으로 교체할까요?`);
      if (!ok) { showToast('업로드가 취소되었습니다.'); return; }
    }

    await dbReplaceAll(records);
    allDocs = records;
    saveMeta({ fileName: file.name, uploadedAt: new Date().toISOString(), count: records.length });

    renderUploadInfo();
    populateFilterOptions();
    applyFilters();
    checkReminders();
    showToast(`${records.length.toLocaleString()}건 업로드 완료`, 4000);
  } catch (err) {
    if (err && err.message === 'HEADER_NOT_FOUND') {
      showToast('제목행("등록구분" 열)을 찾지 못했습니다. 문서등록대장 형식의 엑셀 파일인지 확인해주세요.', 6000);
    } else if (err && err.message === 'MISSING_COLUMN') {
      showToast('필수 열(등록구분, 제목)이 없습니다. 파일 형식을 확인해주세요.', 6000);
    } else {

document.getElementById('regtype-chip-row').addEventListener('click', e => {

sortToggleBtn.addEventListener('click', () => {
  sortOrder = sortOrder === 'desc' ? 'asc' : sortOrder === 'asc' ? 'month' : 'desc';
  sortToggleBtn.textContent = SORT_LABELS[sortOrder] + ' ▾';
  applyFilters();
});

loadMoreBtn.addEventListener('click', () => {
  visibleCount += PAGE_SIZE;
  renderList();
});

listContainer.addEventListener('change', e => {
  const cb = e.target.closest('.sched-checkbox');
  if (!cb) return;
  const doc = allDocs.find(d => d.id === Number(cb.dataset.docId));
  if (!doc) return;
  const ok = toggleScheduleItem(doc);
  if (ok === false) { cb.checked = !cb.checked; return; }
  showToast(cb.checked ? '스케줄에 등록되었습니다.' : '스케줄에서 제거되었습니다.', 1500);
  checkReminders();
});

function applyFilters() {
  const titleQuery = titleSearchInput.value.trim().toLowerCase();
  const drafterQuery = drafterSearchInput.value.trim().toLowerCase();
  const docTypeFilter = docTypeSelect.value;
  const yearFilter = yearSelect.value;

  filteredDocs = allDocs.filter(d => {
    if (currentRegTypeChip !== 'all' && shortRegType(d.regType) !== currentRegTypeChip) return false;
    if (docTypeFilter && d.docType !== docTypeFilter) return false;
    if (yearFilter && !(d.regDate || '').startsWith(yearFilter)) return false;
    if (titleQuery && !(d.title || '').toLowerCase().includes(titleQuery)) return false;
    if (drafterQuery && !(d.drafter || '').toLowerCase().includes(drafterQuery)) return false;
    return true;
  });

  filteredDocs.sort((a, b) => {
    if (sortOrder === 'month') {
      const pa = parseEntry(a), pb = parseEntry(b);
      if (!pa && !pb) return 0;
      if (!pa) return 1;
      if (!pb) return -1;
      if (pa.month !== pb.month) return pa.month - pb.month;
      if (pa.day !== pb.day) return pa.day - pb.day;
      return pb.year - pa.year;
    }
    const ad = a.regDate || '', bd = b.regDate || '';
    if (ad === bd) return 0;
    return sortOrder === 'desc' ? (ad < bd ? 1 : -1) : (ad < bd ? -1 : 1);
  });

  visibleCount = PAGE_SIZE;
  renderList();
}

      </div>
      <div class="doc-title">${escapeHtml(d.title)}</div>
      ${d.regDate ? `<div class="doc-meta">${escapeHtml(d.regDate)}</div>` : ''}
      <div class="doc-rows">

        ${d.drafter ? `<div class="row"><span class="k">기안자</span>${escapeHtml(d.drafter)}</div>` : ''}

function renderMonthGroupedList(docs) {
  const scheduledKeys = new Set(getSchedule().map(s => s.key));
  const groups = Array.from({ length: 13 }, () => []);
  docs.forEach(d => {
    const p = parseEntry(d);
    if (p) groups[p.month].push(d);
  });
  let html = `<div class="import-hint" style="margin-bottom:10px;">체크박스를 선택하면 해당 업무가 매년 반복되는 일정으로 스케줄에 등록됩니다 (일정 탭에서 확인 가능).</div>`;
  for (let m = 1; m <= 12; m++) {
    if (!groups[m].length) continue;
    html += `
      <div class="card">
        <div class="month-group-title"><span>${m}월</span><span class="month-group-count">${groups[m].length.toLocaleString()}건</span></div>
        ${groups[m].map(d => renderScheduleDocRow(d, scheduledKeys.has(scheduleKey(d)))).join('')}
      </div>`;

}

function renderList() {
  const slice = filteredDocs.slice(0, visibleCount);
  countLabel.textContent = allDocs.length
    ? `전체 ${allDocs.length.toLocaleString()}건 중 ${filteredDocs.length.toLocaleString()}건`
    : '';
  if (!filteredDocs.length) {
    listContainer.innerHTML = `<div class="empty-note">${allDocs.length ? '검색 결과가 없습니다.' : '업로드된 문서가 없습니다. "업로드" 탭에서 등록대장 엑셀 파일을 올려주세요.'}</div>`;
    loadMoreBtn.style.display = 'none';

  listContainer.innerHTML = sortOrder === 'month' ? renderMonthGroupedList(slice) : slice.map(renderDocCard).join('');

}

/* ---------- Annual schedule / recurring-pattern detection ---------- */
const NOTIFY_ENABLED_KEY = 'cjuDocRegisterNotifyEnabled';
const NOTIFY_LOG_KEY = 'cjuDocRegisterNotifyLastDate';
const SCHEDULE_KEY = 'cjuDocRegisterSchedule';
const REMINDER_WINDOW_DAYS = 14;

let notifyPermission = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';

function getNotifyEnabled() { return localStorage.getItem(NOTIFY_ENABLED_KEY) === '1'; }
function setNotifyEnabled(on) { localStorage.setItem(NOTIFY_ENABLED_KEY, on ? '1' : '0'); }

function getNotifyLastDate() { return localStorage.getItem(NOTIFY_LOG_KEY) || ''; }
function setNotifyLastDate(dateStr) { localStorage.setItem(NOTIFY_LOG_KEY, dateStr); }

function parseEntry(d) {
  const m = /^(\d{4})\/(\d{2})\/(\d{2})/.exec(d.regDate || '');
  if (!m) return null;
  return { year: Number(m[1]), month: Number(m[2]), day: Number(m[3]), title: d.title, docType: d.docType, regDate: d.regDate };
}

// The excel gets re-uploaded periodically and re-parsed from scratch, so a
// row's auto-increment `id` is not stable across uploads - schedule entries
// key off drafter+title+regDate instead, which is stable as long as the
// source registry doesn't rewrite past rows (it only appends).
function scheduleKey(d) { return [d.drafter, d.title, d.regDate].join('||'); }

function getSchedule() {
  try { return JSON.parse(localStorage.getItem(SCHEDULE_KEY) || '[]'); }
  catch (e) { return []; }
}
function saveSchedule(list) { localStorage.setItem(SCHEDULE_KEY, JSON.stringify(list)); }

function toggleScheduleItem(d) {
  const parsed = parseEntry(d);
  if (!parsed) { showToast('등록일자 정보가 없어 스케줄에 등록할 수 없습니다.'); return false; }
  const key = scheduleKey(d);
  const list = getSchedule();
  const idx = list.findIndex(s => s.key === key);
  if (idx >= 0) list.splice(idx, 1);
  else list.push({ key, drafter: d.drafter, title: d.title, docType: d.docType, regDate: d.regDate, year: parsed.year, month: parsed.month, day: parsed.day });
  saveSchedule(list);
  return true;
}
function removeScheduleItem(key) {
  saveSchedule(getSchedule().filter(s => s.key !== key));
}

// Used by the 조회 tab's 월별 sort mode to let a search result be checked
// straight into the schedule without a separate step.
function renderScheduleDocRow(d, checked) {
  const short = shortRegType(d.regType);
  return `
    <label class="sched-row">
      <input type="checkbox" class="sched-checkbox" data-doc-id="${d.id}" ${checked ? 'checked' : ''}>
      <div class="sched-row-body">
        <div class="sched-row-top">
          <span class="badge ${short === '접수' ? 'badge-receive' : 'badge-send'}">${escapeHtml(short)}</span>
          ${d.docType ? `<span class="badge badge-doctype">${escapeHtml(d.docType)}</span>` : ''}
        </div>
        <div class="sched-row-title">${d.drafter ? escapeHtml(d.drafter) + ' · ' : ''}${escapeHtml(d.title)}</div>
        <div class="sched-row-date">${escapeHtml(d.regDate)}</div>
      </div>
    </label>`;
}

function normalizeTitleForMatch(title) {
  return (title || '')
    .replace(/\d+/g, ' ')
    .replace(/[().,~\-\/·※\[\]"'`]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function tokenOverlapRatio(a, b) {
  if (!a.length || !b.length) return 0;
  const setA = new Set(a), setB = new Set(b);
  let common = 0;
  setA.forEach(t => { if (setB.has(t)) common++; });
  return common / Math.max(setA.size, setB.size);
}
// Groups schedule entries into recurring yearly patterns by comparing
// normalized titles (numbers/punctuation stripped) with a token-overlap
// threshold, since the same annual task is rarely worded identically
// across years (e.g. "2022년 5월 강사 국민연금..." vs "2023년도 5월 강사 국민연금...").
// minYears defaults to 1 since every entry here was deliberately picked by
// the user via the checklist below, not statistically inferred.
function buildRecurringClusters(entries, minYears) {
  minYears = minYears == null ? 1 : minYears;
  const clusters = [];
  entries.forEach(e => {
    const tokens = normalizeTitleForMatch(e.title).split(' ').filter(Boolean);
    let best = null, bestScore = 0;
    clusters.forEach(c => {
      const score = tokenOverlapRatio(tokens, c.tokens);
      if (score > bestScore) { bestScore = score; best = c; }
    });
    if (best && bestScore >= 0.6) best.items.push(e);
    else clusters.push({ tokens, items: [e] });
  });
  return clusters.filter(c => new Set(c.items.map(i => i.year)).size >= minYears);
}

const MONTH_CUM_DAYS = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
function forwardDistance(fromMD, toMD) {
  const a = MONTH_CUM_DAYS[fromMD.month - 1] + fromMD.day;
  const b = MONTH_CUM_DAYS[toMD.month - 1] + toMD.day;
  let diff = b - a;
  if (diff < 0) diff += 365;
  return diff;
}
function getTodayMD() {
  const d = new Date();
  return { month: d.getMonth() + 1, day: d.getDate() };
}

// Upcoming reminders are computed from the user-curated schedule (checked
// in the 조회 tab), not the full document history - registering an item is
// what tells the app "this is an annual task", so even a single registered
// occurrence (minYears=1) is reminder-worthy. Clustering happens per
// drafter so two different people's similarly-worded tasks never merge.
function computeUpcomingAll(windowDays) {
  const items = getSchedule();
  const byDrafter = {};
  items.forEach(it => { (byDrafter[it.drafter] = byDrafter[it.drafter] || []).push(it); });

  const today = getTodayMD();
  const upcoming = [];
  Object.entries(byDrafter).forEach(([drafter, list]) => {
    buildRecurringClusters(list, 1).forEach(c => {
      let minDist = Infinity, closestItem = null;
      c.items.forEach(it => {
        const dist = forwardDistance(today, { month: it.month, day: it.day });
        if (dist < minDist) { minDist = dist; closestItem = it; }
      });
      if (minDist <= windowDays) {
        upcoming.push({
          drafter,
          title: closestItem.title,
          month: closestItem.month,
          day: closestItem.day,
          distance: minDist,
          years: [...new Set(c.items.map(i => i.year))].sort(),
        });
      }
    });
  });
  upcoming.sort((a, b) => a.distance - b.distance);
  return upcoming;
}

async function requestNotifyPermission() {
  if (typeof Notification === 'undefined') { showToast('이 브라우저는 알림 기능을 지원하지 않습니다.'); return; }
  try {
    notifyPermission = await Notification.requestPermission();
  } catch (e) { notifyPermission = 'denied'; }
  if (notifyPermission === 'granted') showToast('브라우저 알림이 켜졌습니다.');
  else if (notifyPermission === 'denied') showToast('알림이 거부되었습니다. 브라우저 설정에서 허용해주세요.');
  renderScheduleView();
}

// Best-effort only: this fires while the app tab is open (checked once per
// load), not as a true background push - there is no server here to deliver
// notifications when the browser/tab is closed.
function checkReminders() {
  const bannerArea = document.getElementById('reminder-banner-area');
  if (!getNotifyEnabled()) { bannerArea.innerHTML = ''; return; }

  const upcoming = computeUpcomingAll(REMINDER_WINDOW_DAYS);
  const todayStr = new Date().toISOString().slice(0, 10);
  if (upcoming.length && notifyPermission === 'granted' && getNotifyLastDate() !== todayStr) {
    try {
      new Notification('다가오는 업무 알림', {
        body: upcoming.slice(0, 3).map(u => `${u.month}월 ${u.day}일경 · [${u.drafter}] ${u.title}`).join('\n'),
      });
    } catch (e) { /* Notification unsupported in this context (e.g. file://) */ }
    setNotifyLastDate(todayStr);
  }

  if (!upcoming.length) { bannerArea.innerHTML = ''; return; }
  const top = upcoming.slice(0, 3);
  bannerArea.innerHTML = `
    <div class="reminder-banner">
      <div class="title">🔔 다가오는 반복 업무 ${upcoming.length}건</div>
      ${top.map(u => `<div class="item">${u.month}월 ${u.day}일경 · <b>${escapeHtml(u.drafter)}</b> · ${escapeHtml(u.title)}</div>`).join('')}
      <button type="button" class="more-link" id="reminder-goto-schedule">일정 탭에서 자세히 보기 →</button>
    </div>`;
  const gotoBtn = document.getElementById('reminder-goto-schedule');
  if (gotoBtn) gotoBtn.addEventListener('click', () => switchPage('schedule'));
}

/* ---------- .ics calendar export ---------- */
function icsEscape(s) {
  return String(s == null ? '' : s).replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n');
}
function toIcsDate(y, m, d) { return `${y}${String(m).padStart(2, '0')}${String(d).padStart(2, '0')}`; }

// One VEVENT per registered item, set to repeat yearly (RRULE FREQ=YEARLY)
// from its original date - calendar apps handle a past DTSTART fine and
// keep recurring it every year going forward.
function generateIcs(items) {
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//청주대학교 업무 매니저//KO', 'CALSCALE:GREGORIAN'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  items.forEach((it, i) => {
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:cju-taskmgr-${i}-${Date.now()}@local`);
    lines.push(`DTSTAMP:${stamp}`);
    lines.push(`DTSTART;VALUE=DATE:${toIcsDate(it.year, it.month, it.day)}`);
    lines.push('RRULE:FREQ=YEARLY');
    lines.push(`SUMMARY:${icsEscape((it.drafter ? '[' + it.drafter + '] ' : '') + it.title)}`);
    if (it.docType) lines.push(`DESCRIPTION:${icsEscape('문서종류: ' + it.docType)}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function exportScheduleIcs() {
  const items = getSchedule();
  if (!items.length) { showToast('내보낼 스케줄이 없습니다.'); return; }
  const ics = generateIcs(items);
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const pad = n => String(n).padStart(2, '0');
  const d = new Date();
  a.href = url;
  a.download = `업무일정_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('ics 파일을 다운로드했습니다. 휴대폰 캘린더 앱에서 "가져오기"로 열어주세요.', 5000);
}

        </div>
        <button class="btn btn-sm ${notifyOn ? 'btn-primary' : 'btn-ghost'}" id="notify-toggle-btn">${notifyOn ? '🔔 알림 켜짐' : '🔕 알림 받기'}</button>
      </div>

  if (notifyOn && notifyPermission !== 'granted' && typeof Notification !== 'undefined') {
    html += `
      <div class="card">
        <div class="import-hint" style="margin-top:0;">브라우저 알림으로 받으려면 알림 권한을 허용해주세요. 이 앱을 열어둔 상태에서만 알림이 울립니다.</div>
        <button class="btn btn-ghost btn-sm" id="request-notify-btn" style="margin-top:8px;">알림 권한 요청</button>
      </div>`;
  }

  html += `
    <div class="card">
      <button class="btn btn-ghost" id="ics-export-btn">📅 휴대폰 캘린더 앱으로 내보내기 (.ics)</button>
      <div class="import-hint">다운로드한 파일을 휴대폰 캘린더 앱(구글 캘린더 등)에서 "가져오기"로 열면 매년 반복되는 일정으로 등록됩니다. 실시간 자동 동기화는 아니라서, 스케줄을 추가/삭제한 뒤에는 다시 내보내기 해서 다시 가져와야 최신 상태로 맞춰집니다.</div>
    </div>

    <div class="card">
      <div class="stat-section-title">다가오는 업무 (${REMINDER_WINDOW_DAYS}일 이내)</div>
      ${upcoming.length ? upcoming.map(u => `
        <div class="upcoming-item">
          <div class="upcoming-date">${u.month}월 ${u.day}일경 · D-${u.distance}</div>
          <div class="upcoming-title">${escapeHtml(u.drafter)} · ${escapeHtml(u.title)}</div>
          <div class="upcoming-years">스케줄 등록 · ${u.years.join(', ')}</div>
        </div>`).join('') : `<div class="empty-note">${items.length ? '다가오는 반복 업무가 없습니다.' : '아직 스케줄에 등록된 업무가 없습니다. 조회 탭에서 월별 정렬로 검색한 뒤 체크박스로 등록해보세요.'}</div>`}
    </div>`;

  const byMonth = Array.from({ length: 13 }, () => []);
  items.forEach(it => byMonth[it.month].push(it));

  html += `<div class="card"><div class="stat-section-title">월별 일정</div>`;
  const anyMonth = items.length > 0;
  if (!anyMonth) {
    html += `<div class="empty-note">등록된 일정이 없습니다.</div>`;
  } else {
    for (let m = 1; m <= 12; m++) {
      if (!byMonth[m].length) continue;
      const monthItems = byMonth[m].slice().sort((a, b) => a.day - b.day || b.year - a.year);
      html += `
        <div class="month-group-title" style="margin-top:14px;"><span>${m}월</span><span class="month-group-count">${monthItems.length}건</span></div>
        ${monthItems.map(it => `
          <div class="pattern-item">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
              <div>
                <div class="pattern-title">${escapeHtml(it.drafter)} · ${escapeHtml(it.title)}</div>
                <div class="pattern-meta">${m}월 ${it.day}일 (${it.year}년 등록${it.docType ? ' · ' + escapeHtml(it.docType) : ''})</div>
              </div>
              <button type="button" class="del-btn" data-remove-key="${escapeHtml(it.key)}" title="스케줄에서 제거">✕</button>
            </div>
          </div>`).join('')}`;
    }
  }
  html += `</div>`;

  container.innerHTML = html;
}

document.getElementById('schedule-content').addEventListener('click', e => {
  if (e.target.id === 'notify-toggle-btn') {
    setNotifyEnabled(!getNotifyEnabled());
    renderScheduleView();
    checkReminders();
    return;
  }
  if (e.target.id === 'request-notify-btn') { requestNotifyPermission(); return; }
  if (e.target.id === 'ics-export-btn') { exportScheduleIcs(); return; }
  const removeBtn = e.target.closest('[data-remove-key]');
  if (removeBtn) {
    removeScheduleItem(removeBtn.dataset.removeKey);
    renderScheduleView();
    checkReminders();
    return;
  }
});

/* ---------- Init ---------- */
(async function init() {
  try {
    allDocs = await dbGetAll();
  } catch (e) {
    allDocs = [];
  }
  renderUploadInfo();
  populateFilterOptions();
  applyFilters();
  checkReminders();
})();
</script>
</body>
</html>
