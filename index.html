<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>차량확인</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --green: #16a34a;
    --red: #dc2626;
    --gray: #9ca3af;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --sub: #6b7280;
    --border: #e5e7eb;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif;
    color: var(--text);
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  header {
    background: var(--blue);
    color: #fff;
    padding: 16px 20px calc(16px + env(safe-area-inset-top, 0px));
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    position: sticky;
    top: 0;
    z-index: 20;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header .date {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }

  .info-row {
    display: flex;
    gap: 8px;
    margin: 14px 20px 0;
  }

  .info-row input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    background: var(--card);
  }

  .progress-wrap {
    margin: 14px 20px 4px;
  }

  .progress-bar {
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-bar > div {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 0.25s ease;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--sub);
    margin-top: 6px;
  }

  main {
    flex: 1;
    padding: 4px 16px 120px;
    overflow-y: auto;
  }

  .section {
    background: var(--card);
    border-radius: 14px;
    margin-top: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    overflow: hidden;
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
  }

  .section-head .title {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-head .count {
    font-size: 12px;
    color: var(--sub);
    font-weight: 500;
  }

  .section-head .chevron {
    transition: transform 0.2s;
    color: var(--sub);
  }

  .section.collapsed .chevron { transform: rotate(-90deg); }

  .section-body {
    border-top: 1px solid var(--border);
  }

  .section.collapsed .section-body { display: none; }

  .item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .item:last-child { border-bottom: none; }

  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .item-label {
    font-size: 14px;
    flex: 1;
  }

  .state-btn {
    min-width: 78px;
    text-align: center;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    border: 1.5px solid var(--border);
    background: #f9fafb;
    color: var(--sub);
  }

  .state-btn[data-state="ok"] {
    background: #ecfdf3;
    border-color: var(--green);
    color: var(--green);
  }

  .state-btn[data-state="issue"] {
    background: #fef2f2;
    border-color: var(--red);
    color: var(--red);
  }

  .note-input {
    margin-top: 8px;
    width: 100%;
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
  }

  .note-input::placeholder { color: #f3a5a5; }

  footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 8px;
    z-index: 20;
  }

  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 8px 0 4px;
    font-size: 12px;
    color: var(--sub);
    background: none;
    border: none;
    cursor: pointer;
  }

  .tab-btn .icon { font-size: 20px; display: block; }
  .tab-btn.active { color: var(--blue); font-weight: 700; }

  .submit-fab {
    position: fixed;
    left: 16px; right: 16px;
    bottom: 76px;
    max-width: 448px;
    margin: 0 auto;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(37,99,235,0.35);
    z-index: 15;
  }

  .submit-fab:disabled {
    background: var(--gray);
    box-shadow: none;
  }

  .page { display: none; }
  .page.active { display: block; }

  /* Result screen */
  .result-summary {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    margin: 14px 0;
    text-align: center;
  }

  .result-summary .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 10px;
  }

  .badge.pass { background: #ecfdf3; color: var(--green); }
  .badge.fail { background: #fef2f2; color: var(--red); }

  .result-summary .vehicle { font-size: 18px; font-weight: 700; }
  .result-summary .when { font-size: 12px; color: var(--sub); margin-top: 4px; }

  .issue-card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 10px;
    border-left: 4px solid var(--red);
  }

  .issue-card .item-name { font-weight: 700; font-size: 14px; }
  .issue-card .item-note { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .issue-card .item-section { font-size: 11px; color: var(--gray); margin-top: 2px; }

  .empty-note {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    padding: 30px 10px;
  }

  .primary-btn {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    margin-top: 16px;
  }

  .ghost-btn {
    width: 100%;
    background: none;
    color: var(--blue);
    border: 1.5px solid var(--blue);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    margin-top: 8px;
  }

  /* History */
  .history-card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 12px;
  }

  .history-card .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .history-card .vehicle { font-weight: 700; font-size: 15px; }
  .history-card .when { font-size: 12px; color: var(--sub); margin-top: 2px; }

  .history-card .detail {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    display: none;
  }

  .history-card.open .detail { display: block; }

  .history-card .del-btn {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 12px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>🚗 차량확인</h1>
    <div class="date" id="today-date"></div>
  </header>

  <div id="page-check" class="page active">
    <div class="info-row">
      <input id="vehicle-number" type="text" placeholder="차량번호 입력 (예: 12가 3456)">
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <div class="progress-label">
        <span id="progress-text">0 / 0 항목 확인</span>
        <span id="issue-text"></span>
      </div>
    </div>
    <main id="checklist-main"></main>
  </div>

  <div id="page-result" class="page">
    <main id="result-main" style="padding:16px 16px 120px;"></main>
  </div>

  <div id="page-history" class="page">
    <main id="history-main" style="padding:16px 16px 120px;"></main>
  </div>

  <button id="submit-fab" class="submit-fab" style="display:none;">점검 완료</button>

  <footer>
    <button class="tab-btn active" data-tab="check"><span class="icon">📋</span>점검</button>
    <button class="tab-btn" data-tab="history"><span class="icon">🕓</span>기록</button>
  </footer>

</div>

<script>
const CHECKLIST = [
  { section: '외관 점검', icon: '🚘', items: ['차체 외관 (찌그러짐/스크래치)', '전조등 · 후미등', '방향지시등', '와이퍼', '번호판'] },
  { section: '타이어', icon: '🛞', items: ['타이어 마모 상태', '타이어 공기압', '스페어타이어/공구'] },
  { section: '엔진룸', icon: '🔧', items: ['엔진오일', '냉각수', '워셔액', '브레이크 오일'] },
  { section: '실내 점검', icon: '🪑', items: ['계기판 경고등', '브레이크 작동', '핸들 상태', '안전벨트', '에어컨/히터'] },
  { section: '서류 · 안전용품', icon: '📄', items: ['자동차등록증', '보험증', '삼각대/안전조끼', '소화기'] },
];

const STATES = ['none', 'ok', 'issue'];
const STATE_LABEL = { none: '확인', ok: '정상', issue: '이상' };

let checkState = {};

function itemKey(sIdx, iIdx) { return sIdx + '-' + iIdx; }

function resetChecklist() {
  checkState = {};
  CHECKLIST.forEach((sec, sIdx) => {
    sec.items.forEach((_, iIdx) => {
      checkState[itemKey(sIdx, iIdx)] = { state: 'none', note: '' };
    });
  });
}
resetChecklist();

function totalItemCount() {
  return CHECKLIST.reduce((sum, sec) => sum + sec.items.length, 0);
}

function checkedCount() {
  return Object.values(checkState).filter(v => v.state !== 'none').length;
}

function issueCount() {
  return Object.values(checkState).filter(v => v.state === 'issue').length;
}

function renderChecklist() {
  const main = document.getElementById('checklist-main');
  main.innerHTML = CHECKLIST.map((sec, sIdx) => {
    const doneInSec = sec.items.filter((_, iIdx) => checkState[itemKey(sIdx, iIdx)].state !== 'none').length;
    const itemsHtml = sec.items.map((label, iIdx) => {
      const key = itemKey(sIdx, iIdx);
      const st = checkState[key];
      const noteBox = st.state === 'issue'
        ? `<input class="note-input" data-key="${key}" placeholder="이상 내용을 입력하세요" value="${st.note.replace(/"/g, '&quot;')}">`
        : '';
      return `
        <div class="item">
          <div class="item-row">
            <div class="item-label">${label}</div>
            <button class="state-btn" data-key="${key}" data-state="${st.state}">${STATE_LABEL[st.state]}</button>
          </div>
          ${noteBox}
        </div>`;
    }).join('');

    return `
      <div class="section" data-section="${sIdx}">
        <div class="section-head" data-toggle="${sIdx}">
          <div class="title">${sec.icon} ${sec.section}</div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="count">${doneInSec}/${sec.items.length}</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="section-body">${itemsHtml}</div>
      </div>`;
  }).join('');

  updateProgress();
}

function updateProgress() {
  const total = totalItemCount();
  const done = checkedCount();
  const issues = issueCount();
  document.getElementById('progress-fill').style.width = (total ? (done / total * 100) : 0) + '%';
  document.getElementById('progress-text').textContent = `${done} / ${total} 항목 확인`;
  document.getElementById('issue-text').textContent = issues ? `⚠️ 이상 ${issues}건` : '';

  const fab = document.getElementById('submit-fab');
  if (done === total && total > 0) {
    fab.style.display = 'block';
    fab.disabled = false;
    fab.textContent = issues ? `점검 완료 (이상 ${issues}건)` : '점검 완료';
  } else {
    fab.style.display = 'none';
  }
}

document.getElementById('checklist-main').addEventListener('click', e => {
  const toggleEl = e.target.closest('[data-toggle]');
  if (toggleEl) {
    const sec = document.querySelector(`.section[data-section="${toggleEl.dataset.toggle}"]`);
    sec.classList.toggle('collapsed');
    return;
  }
  const btn = e.target.closest('.state-btn');
  if (btn) {
    const key = btn.dataset.key;
    const cur = checkState[key];
    const idx = STATES.indexOf(cur.state);
    cur.state = STATES[(idx + 1) % STATES.length];
    if (cur.state !== 'issue') cur.note = '';
    renderChecklist();
  }
});

document.getElementById('checklist-main').addEventListener('input', e => {
  if (e.target.classList.contains('note-input')) {
    checkState[e.target.dataset.key].note = e.target.value;
  }
});

function todayString() {
  const d = new Date();
  return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' })
    + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}
document.getElementById('today-date').textContent = todayString();

function loadHistory() {
  try { return JSON.parse(localStorage.getItem('vehicleCheckHistory') || '[]'); }
  catch (e) { return []; }
}
function saveHistory(list) {
  localStorage.setItem('vehicleCheckHistory', JSON.stringify(list));
}

function buildRecord() {
  const vehicleNumber = document.getElementById('vehicle-number').value.trim() || '미입력';
  const items = [];
  CHECKLIST.forEach((sec, sIdx) => {
    sec.items.forEach((label, iIdx) => {
      const st = checkState[itemKey(sIdx, iIdx)];
      items.push({ section: sec.section, label, state: st.state, note: st.note });
    });
  });
  return {
    id: Date.now(),
    vehicleNumber,
    date: new Date().toISOString(),
    items,
    issueCount: items.filter(i => i.state === 'issue').length,
    total: items.length,
  };
}

let lastRecord = null;

document.getElementById('submit-fab').addEventListener('click', () => {
  const record = buildRecord();
  const history = loadHistory();
  history.unshift(record);
  saveHistory(history);
  lastRecord = record;
  renderResult(record);
  switchPage('result');
});

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' })
    + ' ' + d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function renderResult(record) {
  const main = document.getElementById('result-main');
  const pass = record.issueCount === 0;
  const issues = record.items.filter(i => i.state === 'issue');
  main.innerHTML = `
    <div class="result-summary">
      <div class="badge ${pass ? 'pass' : 'fail'}">${pass ? '✅ 이상 없음' : `⚠️ 이상 ${record.issueCount}건 발견`}</div>
      <div class="vehicle">${record.vehicleNumber}</div>
      <div class="when">${formatDate(record.date)} · 총 ${record.total}개 항목 점검</div>
    </div>
    ${issues.length ? issues.map(i => `
      <div class="issue-card">
        <div class="item-name">${i.label}</div>
        ${i.note ? `<div class="item-note">${i.note}</div>` : ''}
        <div class="item-section">${i.section}</div>
      </div>`).join('') : '<div class="empty-note">모든 항목이 정상입니다.</div>'}
    <button class="primary-btn" id="new-check-btn">새 점검 시작</button>
    <button class="ghost-btn" id="go-history-btn">기록 보기</button>
  `;
  document.getElementById('new-check-btn').addEventListener('click', () => {
    resetChecklist();
    document.getElementById('vehicle-number').value = '';
    renderChecklist();
    switchPage('check');
  });
  document.getElementById('go-history-btn').addEventListener('click', () => {
    renderHistory();
    switchPage('history');
  });
}

function renderHistory() {
  const main = document.getElementById('history-main');
  const history = loadHistory();
  if (!history.length) {
    main.innerHTML = '<div class="empty-note">저장된 점검 기록이 없습니다.</div>';
    return;
  }
  main.innerHTML = history.map(rec => {
    const pass = rec.issueCount === 0;
    const issues = rec.items.filter(i => i.state === 'issue');
    return `
      <div class="history-card" data-id="${rec.id}">
        <div class="top-row" data-toggle-history="${rec.id}">
          <div>
            <div class="vehicle">${rec.vehicleNumber}</div>
            <div class="when">${formatDate(rec.date)}</div>
          </div>
          <div class="badge ${pass ? 'pass' : 'fail'}">${pass ? '정상' : `이상 ${rec.issueCount}건`}</div>
        </div>
        <div class="detail">
          ${issues.length ? issues.map(i => `
            <div class="issue-card">
              <div class="item-name">${i.label}</div>
              ${i.note ? `<div class="item-note">${i.note}</div>` : ''}
              <div class="item-section">${i.section}</div>
            </div>`).join('') : '<div class="empty-note">모든 항목이 정상입니다.</div>'}
          <button class="del-btn" data-del="${rec.id}">이 기록 삭제</button>
        </div>
      </div>`;
  }).join('');
}

document.getElementById('history-main').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const id = Number(del.dataset.del);
    const history = loadHistory().filter(r => r.id !== id);
    saveHistory(history);
    renderHistory();
    return;
  }
  const toggle = e.target.closest('[data-toggle-history]');
  if (toggle) {
    document.querySelector(`.history-card[data-id="${toggle.dataset.toggleHistory}"]`).classList.toggle('open');
  }
});

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const tabName = name === 'result' ? 'check' : name;
  const tabBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
  if (tabBtn) tabBtn.classList.add('active');
  document.getElementById('submit-fab').style.display = name === 'check' ? '' : 'none';
  if (name === 'check') updateProgress();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    if (tab === 'history') renderHistory();
    switchPage(tab);
  });
});

renderChecklist();
</script>
</body>
</html>
